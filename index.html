<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artvas — Free Design Editor</title>
    <meta name="description" content="Artvas is a free browser-based design editor for social posts, posters, presentations and more." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;800&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=Lobster&family=Pacifico&family=Oswald:wght@400;700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&family=Anton&family=Merriweather:wght@400;700&family=Abril+Fatface&family=Caveat:wght@400;700&family=Righteous&family=Space+Grotesk:wght@400;700&family=DM+Serif+Display&family=Permanent+Marker&family=Archivo+Black&family=Great+Vibes&family=Josefin+Sans:wght@400;700&family=Instrument+Serif:ital@0;1&family=Syne:wght@500;700;800&family=Unbounded:wght@400;700;900&family=Bricolage+Grotesque:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,400;0,700;1,400&family=Shrikhand&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <div class="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#f4f3f8;font-family:Inter,system-ui,sans-serif;color:#18181b">
        <div style="text-align:center;padding:24px">
          <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><defs><linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset=".55" stop-color="#e2489a"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#bg0)"/><path d="M17 48 32 14l15 34" stroke="#fff" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M27.5 33.5v10l9-5z" fill="#fff"/></svg>
          <p style="font-weight:700;margin:12px 0 4px">Loading Artvas…</p>
          <p class="boot-help" hidden style="font-size:13px;color:#52525b;max-width:320px;margin:8px auto">Taking longer than usual. If Artvas is open in another tab, close it, then <a href="" onclick="location.reload();return false">reload</a>.</p>
        </div>
      </div>
    </div>
    <script>setTimeout(function () { var h = document.querySelector('.boot-help'); if (h) h.hidden = false; }, 8000);</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
